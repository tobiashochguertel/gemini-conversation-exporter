name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run tests
        run: npm test

      - name: Build userscript
        run: npm run build

      - name: Verify committed userscript is current
        run: git diff --exit-code -- dist/gemini-conversation-exporter.user.js
