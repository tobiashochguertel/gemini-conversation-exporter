# Extra instructions appended to the system prompt.
# Use this to customize tone, style, or project-specific conventions.
system_extra = """
This is a Tampermonkey userscript that exports Gemini conversations as Markdown.
It's a fork of `dikelps/gemini-conversation-exporter` with modular architecture refactoring.
"""

# Extra context included in every user prompt.
# Useful for project descriptions or recurring context.
context = """
Project: gemini-conversation-exporter — a userscript built from modular source files in `src/` assembled by `scripts/build.js` into a single `.user.js` file.
"""

[defaults]
# Use OpenRouter (OpenAI-compatible) with a cheap fast model.
# OPENROUTER_API_KEY is bridged to OPENAI_API_KEY by scripts/release.js.
model = "google/gemini-3.7-flash"
max_tokens = 16384
repo = "tobiashochguertel/gemini-conversation-exporter"
provider = "openai"
base_url = "https://openrouter.ai/api/v1"
#emoji = true
#verify_links = true
#match_style = true
